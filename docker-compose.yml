services:
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: video-downloader-api:latest
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${PORT:-4000}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      TEMP_DIR: ${TEMP_DIR:-/var/tmp/video-downloader}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      MAX_VIDEO_SIZE_MB: ${MAX_VIDEO_SIZE_MB:-2048}
      MAX_PROCESSING_TIME_SECONDS: ${MAX_PROCESSING_TIME_SECONDS:-900}
      MAX_CONCURRENT_JOBS_PER_IP: ${MAX_CONCURRENT_JOBS_PER_IP:-2}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-10}
      RATE_LIMIT_DOWNLOAD_PER_MINUTE: ${RATE_LIMIT_DOWNLOAD_PER_MINUTE:-5}
      RATE_LIMIT_POLLING_PER_MINUTE: ${RATE_LIMIT_POLLING_PER_MINUTE:-120}
      JOB_RETRY_ATTEMPTS: ${JOB_RETRY_ATTEMPTS:-3}
      JOB_RETRY_BACKOFF_MS: ${JOB_RETRY_BACKOFF_MS:-15000}
      TEMP_FILE_TTL_MINUTES: ${TEMP_FILE_TTL_MINUTES:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
    volumes:
      - temp_processing:${TEMP_DIR:-/var/tmp/video-downloader}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    image: video-downloader-worker:latest
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: ${REDIS_URL}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      TEMP_DIR: ${TEMP_DIR:-/var/tmp/video-downloader}
      MAX_VIDEO_SIZE_MB: ${MAX_VIDEO_SIZE_MB:-2048}
      MAX_PROCESSING_TIME_SECONDS: ${MAX_PROCESSING_TIME_SECONDS:-900}
      TEMP_FILE_TTL_MINUTES: ${TEMP_FILE_TTL_MINUTES:-30}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SENTRY_DSN: ${SENTRY_DSN:-}
      METRICS_PORT: ${METRICS_PORT:-9091}
    volumes:
      - temp_processing:${TEMP_DIR:-/var/tmp/video-downloader}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "node", "-e", "const fs=require('fs');const t=parseInt(fs.readFileSync('/tmp/worker-heartbeat','utf8'),10);process.exit((Date.now()-t)<45000?0:1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    # Scale independently of the API, e.g.:
    # docker compose up --scale worker=3

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-video_downloader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-video_downloader}
      POSTGRES_INITDB_ARGS: "-c shared_buffers=256MB -c max_connections=200"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-video_downloader}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  temp_processing:

networks:
  internal:
    driver: bridge
