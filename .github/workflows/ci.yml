name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck & lint
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/video_downloader
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Build shared packages
        run: npm run build:packages

      - name: Typecheck (api, worker, web)
        run: npm run typecheck

      - name: Lint (web)
        run: npm run lint --workspace=apps/web

  test:
    name: Test suite
    runs-on: ubuntu-latest
    needs: typecheck
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: video_downloader_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/video_downloader_test
      REDIS_URL: redis://localhost:6379
      ADMIN_USERNAME: test-admin
      ADMIN_PASSWORD: test-admin-password
      FRONTEND_URL: http://localhost:3000
      TEMP_DIR: /tmp/video-downloader-test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations to test database
        run: npx prisma migrate deploy --schema=packages/database/prisma/schema.prisma

      - name: Build shared packages
        run: npm run build:packages

      - name: Create temp dir
        run: mkdir -p "$TEMP_DIR"

      # In order: packages/security, packages/media-extractor,
      # apps/worker (all Vitest, fully mocked/hermetic), apps/web
      # (Vitest + Testing Library, mocked API), apps/api (Jest — guard
      # unit tests plus real integration/e2e tests against the Postgres
      # and Redis services above).
      - name: Run test suites
        run: npm test

  e2e:
    name: Playwright e2e
    runs-on: ubuntu-latest
    needs: typecheck
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build shared packages
        run: npm run build:packages

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: Build web app
        run: npm run build --workspace=apps/web

      - name: Run Playwright tests
        run: npm run e2e --workspace=apps/web

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  docker-build:
    name: Docker build (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: [typecheck, test]
    strategy:
      matrix:
        service: [api, worker, web]
    steps:
      - uses: actions/checkout@v4

      - name: Build ${{ matrix.service }} image
        run: docker build -f docker/${{ matrix.service }}.Dockerfile -t video-downloader-${{ matrix.service }}:ci .
